[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enpda-mces"
version = "0.1.0"
description = "Equivariant Neural Primal-Dual Assignment and matched MCES baselines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.0",
  "torch-geometric>=2.3",
  "rdkit>=2024.3",
  "networkx>=3.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]
official-nga = ["ogb>=1.3.6", "pygmtools>=0.6.0"]

[project.scripts]
enpda = "nema.cli:main"
nema = "nema.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
